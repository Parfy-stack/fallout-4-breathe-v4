; Respiration.ini — rechargé automatiquement toutes les secondes quand le jeu tourne :
; tu peux régler pendant que tu joues, sans recompiler ni relancer.

[General]
Enabled = 1

; 1 = écrit dans le log (Documents\My Games\Fallout4\F4SE\Respiration.log) l'endurance lue,
; la période et le nombre de nœuds modifiés, toutes les 2 secondes.
Debug = 1

; Os à faire respirer, séparés par des virgules. Le corps doit être pondéré sur ces os.
; Belly_skin = os du ventre utilisé par CBP/OCBP (corps CBBE, Fusion Girl...).
Bones = Belly_skin

; Durée d'une respiration complète, en secondes.
RestPeriod = 4.0        ; reposé
ExhaustedPeriod = 1.0   ; à bout de souffle

; Amplitude : variation de l'échelle de l'os (0.02 = +2 %).
RestAmplitude = 0.015
ExhaustedAmplitude = 0.05

; Vitesse à laquelle le rythme suit l'endurance (plus grand = plus réactif).
Smoothing = 2.0
