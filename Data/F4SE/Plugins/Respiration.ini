; Respiration.ini — rechargé automatiquement toutes les secondes quand le jeu tourne :
; tu peux régler pendant que tu joues, sans recompiler ni relancer.

[General]
Enabled = 1

; 1 = écrit dans le log (Documents\My Games\Fallout4\F4SE\Respiration.log) l'endurance lue,
; la période et le nombre de nœuds modifiés, toutes les 2 secondes.
Debug = 1

; --- ÉTAPE 1 : trouver le bon nom d'os ---
; Mets Mode = ListBones et relance le jeu. Le plugin ne modifie rien : il écrit dans le log
; la liste de tous les os dont le nom contient "belly", "spine", "chest", "torso", "com",
; "pelvis" ou "waist". Repère celui qui correspond au niveau du diaphragme, mets son nom
; exact (casse comprise) dans Bones ci-dessous, puis repasse Mode à Translate ou Scale.
;
; --- ÉTAPE 2 : choisir comment l'os bouge ---
; Translate = déplace l'os le long d'un axe (recommandé, plus naturel : le ventre "avance").
; Scale     = gonfle l'os dans les 3 axes à la fois (effet plus artificiel, "ballon").
Mode = Translate

; Os à faire respirer, séparés par des virgules. Le corps doit être pondéré sur ces os
; (comme pour CBP/OCBP). Belly_skin = os historiquement utilisé par CBP/OCBP.
Bones = Belly_skin

; Durée d'une respiration complète, en secondes.
RestPeriod = 4.0        ; reposé
ExhaustedPeriod = 1.0   ; à bout de souffle

; --- Réglages du mode Translate ---
; Axe le long duquel l'os se déplace, dans son repère local : x, y ou z.
; Le bon axe dépend de l'orientation de l'os choisi — si le mouvement part dans le mauvais
; sens (vers le haut au lieu de l'avant, par ex.), essaie un autre axe.
TranslateAxis = y
RestTranslate = 0.15       ; unités du jeu (~1 unité ≈ 1.4 cm), reposé
ExhaustedTranslate = 0.5   ; unités du jeu, à bout de souffle

; --- Réglages du mode Scale (ignorés si Mode = Translate) ---
RestAmplitude = 0.08
ExhaustedAmplitude = 0.15

; Vitesse à laquelle le rythme suit l'endurance (plus grand = plus réactif).
Smoothing = 2.0
